name: Apply direct flow fixes

on:
  push:
    branches:
      - fix/natural-menu-profile-eligibility

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[direct-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-menu-profile-eligibility
          fetch-depth: 0
      - name: Restore index line endings and apply minimal frontend edits
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          text = subprocess.check_output(['git','show','origin/main:static/index.html'])
          def b(value):
              return value.encode('utf-8')
          replacements = [
              (b("                    explore_without_profile: true,\r\n"), b("                    explore_without_profile: false,\r\n"), 1),
              (b("                    topic: pendingInterest,\r\n                    use_previous_context: false,\r\n                    confidence: 'high',\r\n"), b("                    topic: pendingInterest,\r\n                    use_previous_context: false,\r\n                    explore_without_profile: true,\r\n                    confidence: 'high',\r\n"), 1),
              (b("function renderResponseWithCard(data) {\r\n    const st = data.state || {};\r\n"), b("function renderResponseWithCard(data) {\r\n    const st = data.state || {};\r\n    const command = data.ui_command;\r\n    if (st.profile) serverProfile = st.profile;\r\n\r\n    if (command && command.type) {\r\n        isWaiting = false;\r\n        document.getElementById('sendBtn').disabled = false;\r\n        if (command.type === 'START_EXPLAIN') { startExplain(); return; }\r\n        if (command.type === 'START_RECOMMEND') { startRecommend(); return; }\r\n        if (command.type === 'START_ELIGIBILITY') { startEligibility(); return; }\r\n        if (command.type === 'RESET_CHAT') {\r\n            document.getElementById('chatMessages').innerHTML = '';\r\n            pendingInterest = '';\r\n            lastMissingFields = null;\r\n            lastEligibilityPolicyId = null;\r\n            lastEligibilityFields = [];\r\n            profileResumePolicyId = null;\r\n            serverProfile = st.profile || {};\r\n            addBotMessage(data.response || '대화가 초기화되었어요. 아래 버튼을 눌러보세요!');\r\n            return;\r\n        }\r\n        if (command.type === 'RESET_PROFILE') {\r\n            deactivateAllCards();\r\n            if (command.policy_id) {\r\n                lastEligibilityPolicyId = command.policy_id;\r\n                profileResumePolicyId = command.policy_id;\r\n            }\r\n            if (Array.isArray(command.fields)) {\r\n                lastEligibilityFields = [...command.fields];\r\n                lastMissingFields = [...command.fields];\r\n            }\r\n            if (data.response) addBotMessage(data.response);\r\n            showProfileCard(Array.isArray(command.fields) && command.fields.length ? command.fields : undefined);\r\n            return;\r\n        }\r\n    }\r\n"), 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'frontend replacement expected {expected}, found {count}: {old[:60]!r}')
              text = text.replace(old, new, expected)
          Path('static/index.html').write_bytes(text)
      - name: Remove temporary/runtime patch files
        run: |
          rm -f sitecustomize.py static/navigation_sync.js tools/apply_direct_flow_fix.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep fixes in core source files [direct-cleanup-applied]"
          git push origin HEAD:fix/natural-menu-profile-eligibility
