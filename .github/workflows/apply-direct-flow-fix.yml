name: Apply direct flow fixes

on:
  push:
    branches:
      - fix/natural-menu-profile-eligibility

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[direct-flow-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-menu-profile-eligibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply direct source patches
        run: python tools/apply_direct_flow_fix.py
      - name: Commit direct source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.py server.py static/index.html README.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix natural menu, profile and eligibility flows [direct-flow-applied]"
          git push origin HEAD:fix/natural-menu-profile-eligibility
