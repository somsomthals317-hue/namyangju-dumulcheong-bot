name: Apply server multi-workflow contract fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/server-multi-workflow-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-multi-workflow-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply direct source patch
        run: python tools/apply_server_multi_contract_fix.py
      - name: Quick syntax check
        run: python -m compileall -q agent.py server.py test_conversation_workflows.py
      - name: Remove temporary patch files
        run: rm tools/apply_server_multi_contract_fix.py .github/workflows/apply-server-multi-contract.yml
      - name: Commit direct source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix server multi-workflow contract"
          git push
