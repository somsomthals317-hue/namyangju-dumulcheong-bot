name: Apply routing regression correction

on:
  push:
    branches:
      - fix/final-routing-regression

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[routing-round2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-routing-regression
      - name: Apply correction
        run: python tools/fix_routing_regression_round2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.py test_final_routing_regression.py
          git commit -m "Preserve multi-task routing around recommendation shortcut [routing-round2]"
          git push origin HEAD:fix/final-routing-regression
