name: Apply multi-workflow resume fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/multi-workflow-resume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multi-workflow-resume
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply direct source patches
        run: |
          python tools/apply_multi_workflow_resume_fix.py
          python tools/apply_multi_workflow_resume_followup.py
      - name: Quick syntax check
        run: python -m compileall -q agent.py state.py test_conversation_workflows.py
      - name: Remove temporary patch files
        run: rm tools/apply_multi_workflow_resume_fix.py tools/apply_multi_workflow_resume_followup.py .github/workflows/apply-multi-workflow-resume.yml
      - name: Commit direct source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix multi-workflow resume across profile cards"
          git push
