name: Apply final routing fix

on:
  push:
    branches:
      - fix/final-routing-regression

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-routing-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-routing-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/apply_final_routing_fix.py
      - name: Commit core changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.py server.py test_final_routing_regression.py
          git commit -m "Fix final routing and recommendation gates [final-routing-applied]"
          git push origin HEAD:fix/final-routing-regression
