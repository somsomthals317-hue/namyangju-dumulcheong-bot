name: Update README final routing

on:
  push:
    branches:
      - fix/final-routing-regression

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[readme-final-routing]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-routing-regression
      - name: Update README
        run: python tools/update_readme_final_routing.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document final routing boundaries [readme-final-routing]"
          git push origin HEAD:fix/final-routing-regression
