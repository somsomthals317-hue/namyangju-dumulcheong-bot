name: Fix direct-flow regressions

on:
  push:
    branches:
      - fix/natural-menu-profile-eligibility

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[regression-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-menu-profile-eligibility
      - name: Restrict named eligibility shortcut and update legacy expectation
        shell: python
        run: |
          from pathlib import Path

          agent = Path('agent.py')
          text = agent.read_text(encoding='utf-8')
          old = '    if exact_policy and _is_explicit_eligibility_request(msg):\n'
          new = '''    if (\n        exact_policy\n        and _is_explicit_eligibility_request(msg)\n        # 설명+자격, 추천+자격처럼 한 발화에 여러 Task가 있으면\n        # 단일 자격 shortcut으로 가로채지 않고 atomic workflow에 맡긴다.\n        and not re.search(r"설명|알려|내용|뭐야", msg)\n        and not _is_explicit_recommend_request(msg)\n    ):\n'''
          if text.count(old) != 1:
              raise SystemExit(f'named eligibility condition count={text.count(old)}')
          agent.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('test_conversation_workflows.py')
          text = test.read_text(encoding='utf-8')
          old = '[{"topic": "전체", "excluded_topics": ["교육"], "skip": True}],'
          new = '[{"topic": "전체", "excluded_topics": ["교육"], "skip": None}],'
          if text.count(old) != 1:
              raise SystemExit(f'legacy skip expectation count={text.count(old)}')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent.py test_conversation_workflows.py
          git commit -m "Preserve composite workflows and profile reuse [regression-fix-applied]"
          git push origin HEAD:fix/natural-menu-profile-eligibility
